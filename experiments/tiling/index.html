<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GomJau-Hogg Tilings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <aside id="panel">
      <div class="row">
        <label for="config-select">Tiling</label>
        <div class="row-controls">
          <select id="config-select"></select>
          <button id="random" title="Random tiling">🎲</button>
        </div>
      </div>

      <fieldset class="group">
        <legend>Tiles</legend>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="show-tiles" />
            Tiles
          </label>
          <label class="inline">
            <input type="checkbox" id="tile-weave" />
            Tile weave
          </label>
        </div>

        <div class="row">
          <label for="tile-band">Band width <span id="tile-band-readout">4 px</span></label>
          <input id="tile-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <span class="palette-title">Tiles by shape</span>
            <div id="tile-palette" class="swatch-grid"></div>
          </div>

          <div class="palette-section">
            <span class="palette-title">Edges</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="tile-stroke" value="#202020" />
                <span>Tile edge</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <fieldset class="group">
        <legend>Stars</legend>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="show-stars" checked />
            Stars
          </label>
          <label class="inline">
            <input type="checkbox" id="star-weave" checked />
            Star weave
          </label>
        </div>

        <div class="row">
          <label class="inline">
            <input type="checkbox" id="harmonic-snap" checked />
            Harmonic angle snap
          </label>
        </div>

        <div class="row">
          <label for="angle">Angle <span id="angle-readout">30°</span></label>
          <input id="angle" type="range" min="0" max="90" value="30" step="0.5" />
        </div>

        <div class="row">
          <label for="star-band">Band width <span id="star-band-readout">4 px</span></label>
          <input id="star-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <span class="palette-title">Star</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="star-fill" value="#ebd7af" />
                <span>Fill</span>
              </label>
              <label class="swatch">
                <input type="color" id="star-stroke" value="#c82020" />
                <span>Edge</span>
              </label>
              <label class="swatch">
                <input type="color" id="interstitial-fill" value="#c8643c" />
                <span>Between</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <div class="row">
        <label for="zoom">Zoom <span id="zoom-readout">1.00×</span></label>
        <input id="zoom" type="range" min="0.2" max="6" value="1" step="0.05" />
      </div>

      <div class="row">
        <label class="inline" for="background">
          <input type="color" id="background" value="#ffffff" />
          <span>Background</span>
        </label>
      </div>

      <div class="row buttons">
        <button id="reset-view">Reset view</button>
        <button id="export-svg">SVG</button>
        <button id="export-png">PNG</button>
      </div>

      <p class="hint">Drag to pan · scroll to zoom</p>
    </aside>

    <script type="module" src="./app.js?v=2"></script>
  </body>
</html>
