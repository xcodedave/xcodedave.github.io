<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Islamic Tilings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- First-time swipe-tutorial overlay. Shown only on mobile after a
         5s idle delay, dismissed permanently (localStorage) on first
         canvas touch. `pointer-events: none` so it never intercepts. -->
    <div id="swipe-hint" aria-hidden="true">
      <span class="swipe-hint-finger">👆</span>
    </div>

    <aside id="panel">
      <div class="row primary">
        <label for="config-select">Tiling</label>
        <div class="row-controls">
          <select id="config-select"></select>
          <button id="random" title="Random tiling">🎲</button>
          <button id="panel-toggle" title="Collapse panel" aria-expanded="true" aria-label="Collapse panel">✕</button>
        </div>
      </div>

      <div class="row group-toggle">
        <label class="inline">
          <input type="checkbox" id="show-stars" checked />
          Stars
        </label>
      </div>

      <fieldset class="group" id="stars-group">
        <legend>Stars</legend>

        <div class="row">
          <label class="inline">
            <input type="checkbox" id="harmonic-snap" checked />
            Harmonic angle snap
          </label>
        </div>

        <div class="row">
          <label for="angle">Angle <span id="angle-readout">30°</span></label>
          <input id="angle" type="range" min="0" max="90" value="30" step="0.5" />
        </div>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="star-weave" checked />
            Weave
          </label>
        </div>

        <div class="row">
          <label for="star-band">Ribbon width <span id="star-band-readout">4 px</span></label>
          <input id="star-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <div class="palette-section-header">
              <span class="palette-title">Star</span>
              <button
                type="button"
                id="palette-randomize"
                class="palette-randomize"
                title="Randomise colours from a curated palette"
                aria-label="Randomise palette"
              >🎲</button>
            </div>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="star-fill" value="#ebd7af" />
                <span>Stars</span>
              </label>
              <label class="swatch">
                <input type="color" id="interstitial-fill" value="#c8643c" />
                <span>Polygons</span>
              </label>
            </div>
          </div>

          <div class="palette-section">
            <span class="palette-title">Ribbon</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="star-ribbon-fill" value="#ffffff" />
                <span>Fill</span>
              </label>
              <label class="swatch">
                <input type="color" id="star-ribbon-stroke" value="#c82020" />
                <span>Edge</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <div class="row group-toggle">
        <label class="inline">
          <input type="checkbox" id="show-tiles" />
          Tiles
        </label>
      </div>

      <fieldset class="group" id="tiles-group">
        <legend>Tiles</legend>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="tile-weave" />
            Weave
          </label>
        </div>

        <div class="row">
          <label for="tile-band">Ribbon width <span id="tile-band-readout">4 px</span></label>
          <input id="tile-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <span class="palette-title">Tiles by shape</span>
            <div id="tile-palette" class="swatch-grid"></div>
          </div>

          <div class="palette-section">
            <span class="palette-title">Ribbon</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="tile-ribbon-fill" value="#ffffff" />
                <span>Fill</span>
              </label>
              <label class="swatch">
                <input type="color" id="tile-ribbon-stroke" value="#202020" />
                <span>Edge</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <div class="row">
        <label for="zoom">Zoom <span id="zoom-readout">1.00×</span></label>
        <input id="zoom" type="range" min="0.2" max="6" value="1" step="0.05" />
      </div>

      <div class="row" id="background-row">
        <label class="inline" for="background">
          <input type="color" id="background" value="#ffffff" />
          <span>Background</span>
        </label>
      </div>

      <div class="row buttons">
        <button id="export-svg">SVG</button>
        <button id="export-png">PNG</button>
      </div>

      <p class="hint">Drag to pan · scroll to zoom</p>

      <p id="build-hash" class="build-hash" aria-hidden="true"></p>
    </aside>

    <script type="module" src="./app.js?v=34"></script>
  </body>
</html>
