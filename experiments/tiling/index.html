<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Islamic Tilings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <!-- First-time swipe-tutorial overlay. Shown only on mobile after a
         5s idle delay, dismissed permanently (localStorage) on first
         canvas touch. `pointer-events: none` so it never intercepts. -->
    <div id="swipe-hint" aria-hidden="true">
      <span class="swipe-hint-finger">👆</span>
    </div>

    <!-- Video export region selection. Shown only while the "Video export"
         <details> section is open. The dark mask is `pointer-events: none`
         so the user can still pan/zoom the canvas underneath; the central
         rect + 8 corner/edge handles catch pointer events to allow move /
         resize. Handles and rect are positioned in JS in CSS-pixel space. -->
    <svg id="video-region-overlay" aria-hidden="true">
      <path id="video-region-mask" fill-rule="evenodd"></path>
      <rect id="video-region-rect"></rect>
      <rect class="vr-handle" data-vr-handle="nw"></rect>
      <rect class="vr-handle" data-vr-handle="n"></rect>
      <rect class="vr-handle" data-vr-handle="ne"></rect>
      <rect class="vr-handle" data-vr-handle="e"></rect>
      <rect class="vr-handle" data-vr-handle="se"></rect>
      <rect class="vr-handle" data-vr-handle="s"></rect>
      <rect class="vr-handle" data-vr-handle="sw"></rect>
      <rect class="vr-handle" data-vr-handle="w"></rect>
    </svg>

    <aside id="panel">
      <div class="row primary">
        <label for="config-select">Tiling</label>
        <div class="row-controls">
          <select id="config-select"></select>
          <button id="random" title="Random tiling">🎲</button>
          <button id="panel-toggle" title="Collapse panel" aria-expanded="true" aria-label="Collapse panel">✕</button>
        </div>
      </div>

      <div class="row group-toggle">
        <label class="inline">
          <input type="checkbox" id="show-stars" checked />
          Stars
        </label>
      </div>

      <fieldset class="group" id="stars-group">
        <legend>Stars</legend>

        <div class="row">
          <label class="inline">
            <input type="checkbox" id="harmonic-snap" checked />
            Harmonic angle snap
          </label>
        </div>

        <div class="row">
          <label for="angle">Angle <span id="angle-readout">30°</span></label>
          <input id="angle" type="range" min="0" max="90" value="30" step="0.5" />
        </div>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="star-weave" checked />
            Weave
          </label>
        </div>

        <div class="row">
          <label for="star-band">Ribbon width <span id="star-band-readout">4 px</span></label>
          <input id="star-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <div class="palette-section-header">
              <span class="palette-title">Star</span>
              <button
                type="button"
                id="palette-randomize"
                class="palette-randomize"
                title="Randomise colours from a curated palette"
                aria-label="Randomise palette"
              >🎲</button>
            </div>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="star-fill" value="#ebd7af" />
                <span>Stars</span>
              </label>
              <label class="swatch">
                <input type="color" id="interstitial-fill" value="#c8643c" />
                <span>Polygons</span>
              </label>
            </div>
          </div>

          <div class="palette-section">
            <span class="palette-title">Ribbon</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="star-ribbon-fill" value="#ffffff" />
                <span>Fill</span>
              </label>
              <label class="swatch">
                <input type="color" id="star-ribbon-stroke" value="#c82020" />
                <span>Edge</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <div class="row group-toggle">
        <label class="inline">
          <input type="checkbox" id="show-tiles" />
          Tiles
        </label>
      </div>

      <fieldset class="group" id="tiles-group">
        <legend>Tiles</legend>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="tile-weave" />
            Weave
          </label>
        </div>

        <div class="row">
          <label for="tile-band">Ribbon width <span id="tile-band-readout">4 px</span></label>
          <input id="tile-band" type="range" min="0" max="40" value="4" step="0.5" />
        </div>

        <details class="palette">
          <summary>Colours</summary>

          <div class="palette-section">
            <span class="palette-title">Tiles by shape</span>
            <div id="tile-palette" class="swatch-grid"></div>
          </div>

          <div class="palette-section">
            <span class="palette-title">Ribbon</span>
            <div class="swatch-grid">
              <label class="swatch">
                <input type="color" id="tile-ribbon-fill" value="#ffffff" />
                <span>Fill</span>
              </label>
              <label class="swatch">
                <input type="color" id="tile-ribbon-stroke" value="#202020" />
                <span>Edge</span>
              </label>
            </div>
          </div>
        </details>
      </fieldset>

      <div class="row">
        <label for="zoom">Zoom <span id="zoom-readout">1.00×</span></label>
        <input id="zoom" type="range" min="0.2" max="6" value="1" step="0.05" />
      </div>

      <div class="row" id="background-row">
        <label class="inline" for="background">
          <input type="color" id="background" value="#ffffff" />
          <span>Background</span>
        </label>
      </div>

      <div class="row buttons">
        <button id="export-svg">SVG</button>
        <button id="export-png">PNG</button>
        <button id="export-dxf">DXF</button>
      </div>

      <details class="palette" id="video-export-section">
        <summary>Video export</summary>

        <div class="row">
          <label for="video-start-angle">Start angle <span id="video-start-readout">0°</span></label>
          <input id="video-start-angle" type="range" min="0" max="90" value="0" step="0.5" />
        </div>

        <div class="row">
          <label for="video-end-angle">End angle <span id="video-end-readout">90°</span></label>
          <input id="video-end-angle" type="range" min="0" max="90" value="90" step="0.5" />
        </div>

        <div class="row toggles">
          <label class="inline">
            <input type="checkbox" id="video-loop" checked />
            Loop (start → end → start)
          </label>
        </div>

        <div class="row">
          <label for="video-duration">Duration <span id="video-duration-readout">4.0 s</span></label>
          <input id="video-duration" type="range" min="1" max="60" value="4" step="0.5" />
        </div>

        <div class="row">
          <label for="video-fps">FPS <span id="video-fps-readout">24</span></label>
          <input id="video-fps" type="range" min="10" max="60" value="24" step="1" />
        </div>

        <div class="row">
          <label for="video-format">Format</label>
          <select id="video-format"></select>
        </div>

        <div class="row buttons">
          <button id="export-video">Record</button>
        </div>

        <p class="hint" id="video-status"></p>
      </details>

      <p class="hint">Drag to pan · scroll to zoom</p>
    </aside>

    <script type="module" src="./app.js?v=36"></script>
  </body>
</html>
