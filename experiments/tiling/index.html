<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GomJau-Hogg Tilings</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="stage"></canvas>

    <aside id="panel">
      <h1>GomJau-Hogg Tilings</h1>

      <div class="row">
        <label for="config-select">Tiling</label>
        <div class="row-controls">
          <select id="config-select"></select>
          <button id="random" title="Random tiling">🎲</button>
        </div>
      </div>

      <div class="row toggles">
        <label class="inline">
          <input type="checkbox" id="show-tiles" checked />
          Tiles
        </label>
        <label class="inline">
          <input type="checkbox" id="show-stars" checked />
          Stars
        </label>
      </div>

      <div class="row">
        <label for="angle">Angle <span id="angle-readout">30°</span></label>
        <input id="angle" type="range" min="0" max="90" value="30" step="1" />
      </div>

      <div class="row">
        <label for="band">Band <span id="band-readout">4 px</span></label>
        <input id="band" type="range" min="0" max="40" value="4" step="0.5" />
      </div>

      <div class="row">
        <label for="zoom">Zoom <span id="zoom-readout">1.00×</span></label>
        <input id="zoom" type="range" min="0.2" max="6" value="1" step="0.05" />
      </div>

      <div class="row buttons">
        <button id="reset-view">Reset view</button>
        <button id="export-svg">SVG</button>
        <button id="export-png">PNG</button>
      </div>

      <p class="hint">Drag to pan · scroll to zoom</p>
    </aside>

    <script type="module" src="./app.js"></script>
  </body>
</html>
