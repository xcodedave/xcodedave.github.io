    <style>

      }
      #name-card {
        background: #14161c;

        border-radius: 10px;

        display: flex;
        flex-direction: column;
        gap: 14px;
      }
      #name-card h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      #name-input {
        background: #0b0c10;
        color: #eee;
        border: 1px solid #2a2d36;

      }
      #name-input:focus {

      #name-submit {

        color: #0b0c10;

        border-radius: 6px;
        padding: 10px 12px;
        font-size: 15px;
        font-weight: 600;
        cursor: pointer;
      }
      #name-submit:hover {
        background: #87a3ff;
      }
      #name-status {
        font-size: 13px;
        color: #9aa1ad;
        min-height: 1em;
      }

      /* --- Lobby overlay ------------------------------------------- */
      /* Same visual language as the name card; shown after name entry
         when the server has us in the lobby and hidden once GameStart
         arrives. pointer-events:auto blocks game input while up. */
      #lobby-overlay {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        /* Light wash so the world is still visible behind the card. */
        background: rgba(0, 0, 0, 0.25);
        z-index: 9;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        color: #eee;
      }
      #lobby-card {
        background: #14161c;
        padding: 28px 32px;
        border-radius: 10px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.5);
        min-width: 280px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: center;
      }
      #lobby-card h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
      }
      #lobby-status {
        font-size: 14px;
        color: #9aa1ad;
      }

      /* --- Chat ---------------------------------------------------- */
      /* Pinned to the bottom of the viewport. The whole stack ignores
         pointer events except the form, so the game canvas still
         receives clicks/drags through the message area. */
      #chat {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        display: none; /* shown after name entry completes */
        flex-direction: column;
        align-items: stretch;
        z-index: 5;
        pointer-events: none;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
      }
      /* Messages stack: column anchored to bottom, older messages
         shifted up and faded via mask-image so anything beyond ~6 is
         invisible. Wrapped in #chat-scroll so we can animate a
         translateY on the inner container without disturbing the mask
         on the outer one. */
      #chat-messages {
        max-height: 60vh;
        overflow: hidden;
        padding: 0 16px 6px;
        -webkit-mask-image: linear-gradient(
          to top,
          black 0%,
          black 60%,
          transparent 100%
        );
        mask-image: linear-gradient(
          to top,
          black 0%,
          black 60%,
          transparent 100%
        );
        pointer-events: none;
      }
      #chat-scroll {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        justify-content: flex-end;
        gap: 6px;
        min-height: 100%;
        will-change: transform;
      }
      .chat-bubble {
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        padding: 6px 12px;
        border-radius: 14px;
        font-size: 14px;
        line-height: 1.3;
        max-width: 33.333vw;
        word-wrap: break-word;
        opacity: 0;
        transform: translateY(8px);
        transition: opacity 220ms ease, transform 220ms ease;
        pointer-events: none;
      }
      .chat-bubble.in {
        opacity: 1;
        transform: translateY(0);
      }
      .chat-bubble .chat-name {
        font-weight: 600;
        margin-right: 6px;
        opacity: 0.9;
      }
      /* Input row */
      #chat-form {
        display: flex;
        gap: 8px;
        padding: 8px 12px 12px;
        pointer-events: auto;
        background: linear-gradient(
          to top,
          rgba(0, 0, 0, 0.35),
          transparent
        );
      }
      #chat-input {
        flex: 1;
        background: rgba(0, 0, 0, 0.55);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 18px;
        padding: 8px 14px;
        font-size: 14px;
        outline: none;
      }
      #chat-input:focus {
        border-color: #6a8cff;
      }
      #chat-send {
        background: #6a8cff;
        color: #0b0c10;
        border: none;
        border-radius: 18px;
        padding: 8px 18px;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      #chat-send:hover {
        background: #87a3ff;
      }

          id="name-input"
          type="text"
          maxlength="20"

    <script type="module">
      // Match the canvas backing-store size to the displayed size.
      const canvas = document.getElementById("game");
      const sync = () => {
        const dpr = window.devicePixelRatio || 1;
        canvas.width = Math.floor(window.innerWidth * dpr);
        canvas.height = Math.floor(window.innerHeight * dpr);
      };
      window.addEventListener("resize", sync);
      sync();
      canvas.focus();
    </script>
  </body>
